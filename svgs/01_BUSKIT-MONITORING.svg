<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 230" width="470" height="230" style="background:#1a1a2e">
  <defs>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.7)"/></marker>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1d6ab8"/><stop offset="100%" style="stop-color:#0a3d7a"/></linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#22c55e"/><stop offset="100%" style="stop-color:#15803d"/></linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#374151;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111827;stop-opacity:0.9"/></linearGradient>
    <radialGradient id="knob-grad" cx="35%" cy="35%"><stop offset="0%" style="stop-color:#9ca3af"/><stop offset="100%" style="stop-color:#374151"/></radialGradient>
  </defs>
  <g transform="translate(30,20)">
    <text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">BUSKIT-MONITORING</text>
    <rect x="80" y="38" width="130" height="90" rx="10" fill="url(#grad-dark)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="145" cy="83" r="22" fill="url(#knob-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="145" y1="66" x2="145" y2="73" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="145" y="118" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.6)">gain</text>
    <line x1="20" y1="83" x2="78" y2="83" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="87" font-family="Arial" font-size="13" font-weight="bold" fill="white">IN</text>
    <line x1="210" y1="55" x2="310" y2="55" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="312" y="42" width="100" height="26" rx="6" fill="url(#grad-blue)" filter="url(#glow-blue)"/>
    <text x="362" y="59" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">OUT</text>
    <line x1="210" y1="70" x2="310" y2="70" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="312" y="76" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="362" y="93" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 1</text>
    <line x1="210" y1="83" x2="310" y2="83" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="312" y="110" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="362" y="127" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 2</text>
    <line x1="210" y1="96" x2="310" y2="96" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="312" y="144" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="362" y="161" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 3</text>
    <line x1="210" y1="110" x2="310" y2="110" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="312" y="178" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="362" y="195" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 4</text>
    <line x1="260" y1="55" x2="260" y2="191" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-dasharray="3,3"/>
  </g>
</svg>
