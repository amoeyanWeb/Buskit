<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" style="background:#1a1a2e">
  <defs>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.7)"/></marker>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#6b21a8"/></linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0ea5e9"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#14b8a6"/><stop offset="100%" style="stop-color:#0f766e"/></linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#22c55e"/><stop offset="100%" style="stop-color:#15803d"/></linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#374151;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111827;stop-opacity:0.9"/></linearGradient>
    <radialGradient id="knob-grad" cx="35%" cy="35%"><stop offset="0%" style="stop-color:#9ca3af"/><stop offset="100%" style="stop-color:#374151"/></radialGradient>
  </defs>
  <g transform="translate(30,20)">
    <text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">BUSKIT-MIXER</text>
    <rect x="120" y="38" width="220" height="250" rx="10" fill="url(#grad-dark)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="65" text-anchor="middle" font-family="Arial" font-size="15" fill="rgba(255,255,255,0.7)" font-weight="bold">5 band EQ</text>
    <g opacity="0.7">
 />
    </g>
    <circle cx="300" cy="75" r="16" fill="url(#knob-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="300" y1="61" x2="300" y2="67" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="300" y="105" text-anchor="middle" font-family="Arial" font-size="15" fill="rgba(255,255,255,0.6)">drive</text>
    <text x="200" y="125" text-anchor="middle" font-family="Arial" font-size="15" fill="rgba(255,255,255,0.7)" font-weight="bold">5 band EQ</text>
    <g opacity="0.7">

    </g>
    <circle cx="300" cy="135" r="16" fill="url(#knob-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="300" y1="121" x2="300" y2="127" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="300" y="165" text-anchor="middle" font-family="Arial" font-size="15" fill="rgba(255,255,255,0.6)">drive</text>
    <circle cx="230" cy="215" r="22" fill="url(#knob-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="230" y1="195" x2="230" y2="202" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="230" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="rgba(255,255,255,0.6)">gain</text>
    <!-- Inputs -->
    <line x1="20" y1="65" x2="118" y2="65" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="69" font-family="Arial" font-size="13" font-weight="bold" fill="white">IN1</text>
    <line x1="20" y1="120" x2="118" y2="120" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="124" font-family="Arial" font-size="13" font-weight="bold" fill="white">IN2</text>
    <line x1="20" y1="175" x2="118" y2="175" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="179" font-family="Arial" font-size="13" font-weight="bold" fill="white">Ai</text>
    <line x1="20" y1="205" x2="118" y2="205" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="209" font-family="Arial" font-size="13" font-weight="bold" fill="white">L1</text>
    <line x1="20" y1="228" x2="118" y2="228" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="232" font-family="Arial" font-size="13" font-weight="bold" fill="white">L2</text>
    <line x1="20" y1="255" x2="118" y2="255" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="259" font-family="Arial" font-size="13" font-weight="bold" fill="white">EXP</text>
    <!-- Outputs -->
    <line x1="340" y1="70" x2="410" y2="70" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="412" y="56" width="100" height="26" rx="6" fill="url(#grad-purple)" filter="url(#glow-purple)"/>
    <text x="462" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Amp</text>
    <line x1="340" y1="105" x2="410" y2="105" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="412" y="91" width="100" height="26" rx="6" fill="url(#grad-cyan)"/>
    <text x="462" y="108" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Ao</text>
    <line x1="340" y1="145" x2="410" y2="145" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="412" y="131" width="100" height="26" rx="6" fill="url(#grad-teal)"/>
    <text x="462" y="148" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">rec</text>

    <line x1="340" y1="185" x2="410" y2="185" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="412" y="175" width="100" height="22" rx="5" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="462" y="190" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">MON 1</text>

    <line x1="340" y1="210" x2="410" y2="210" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="412" y="200" width="100" height="22" rx="5" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="462" y="215" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">MON 2</text>

    <line x1="340" y1="235" x2="410" y2="235" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="412" y="225" width="100" height="22" rx="5" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="462" y="240" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">MON 3</text>

    <line x1="340" y1="260" x2="410" y2="260" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="412" y="250" width="100" height="22" rx="5" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="462" y="265" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">MON 4</text>
    <line x1="340" y1="200" x2="340" y2="261" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
   
    <line x1="340" y1="261" x2="410" y2="261" stroke="rgba(255,255,255,0.5)" stroke-width="1.4"/>
  </g>
</svg>
