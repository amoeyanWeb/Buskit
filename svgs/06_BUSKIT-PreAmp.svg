<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 200" width="510" height="200" style="background:#1a1a2e">
  <defs>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.7)"/></marker>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#6b21a8"/></linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0ea5e9"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#374151;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111827;stop-opacity:0.9"/></linearGradient>
    <radialGradient id="knob-grad" cx="35%" cy="35%"><stop offset="0%" style="stop-color:#9ca3af"/><stop offset="100%" style="stop-color:#374151"/></radialGradient>
  </defs>
  <g transform="translate(30,20)">
    <text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">BUSKIT-PreAmp</text>
    <rect x="80" y="38" width="160" height="110" rx="10" fill="url(#grad-dark)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="160" y="68" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="bold">8 band EQ</text>
    <g opacity="0.7">
      <rect x="92" y="75" width="8" height="30" rx="2" fill="#22c55e"/>
      <rect x="103" y="70" width="8" height="35" rx="2" fill="#22c55e"/>
      <rect x="114" y="78" width="8" height="27" rx="2" fill="#22c55e"/>
      <rect x="125" y="65" width="8" height="40" rx="2" fill="#22c55e"/>
      <rect x="136" y="72" width="8" height="33" rx="2" fill="#22c55e"/>
      <rect x="147" y="80" width="8" height="25" rx="2" fill="#22c55e"/>
      <rect x="158" y="68" width="8" height="37" rx="2" fill="#22c55e"/>
      <rect x="169" y="75" width="8" height="30" rx="2" fill="#22c55e"/>
    </g>
    <circle cx="160" cy="120" r="16" fill="url(#knob-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="160" y1="106" x2="160" y2="112" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="160" y="143" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.6)">drive</text>
    <line x1="20" y1="70" x2="78" y2="70" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="74" font-family="Arial" font-size="13" font-weight="bold" fill="white">IN</text>
    <line x1="20" y1="108" x2="78" y2="108" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="112" font-family="Arial" font-size="13" font-weight="bold" fill="white">Ai</text>
    <line x1="240" y1="73" x2="320" y2="73" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="322" y="59" width="100" height="26" rx="6" fill="url(#grad-purple)" filter="url(#glow-purple)"/>
    <text x="372" y="76" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Amp</text>
    <line x1="240" y1="108" x2="320" y2="108" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="322" y="94" width="100" height="26" rx="6" fill="url(#grad-cyan)"/>
    <text x="372" y="111" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Ao</text>
  </g>
</svg>
