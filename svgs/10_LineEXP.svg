<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="580" height="180" style="background:#1a1a2e">
  <defs>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.7)"/></marker>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1d6ab8"/><stop offset="100%" style="stop-color:#0a3d7a"/></linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f97316"/><stop offset="100%" style="stop-color:#c2410c"/></linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#374151;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111827;stop-opacity:0.9"/></linearGradient>
  </defs>
  <g transform="translate(140,20)">
    <text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">LineEXP</text>
    <rect x="80" y="38" width="180" height="100" rx="10" fill="url(#grad-dark)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Inputs from right -->
    <line x1="380" y1="60" x2="262" y2="60" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="382" y="46" width="60" height="26" rx="6" fill="url(#grad-blue)" filter="url(#glow-blue)"/>
    <text x="412" y="63" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">L1</text>
    <line x1="380" y1="88" x2="262" y2="88" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="382" y="74" width="60" height="26" rx="6" fill="url(#grad-blue)" filter="url(#glow-blue)"/>
    <text x="412" y="91" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">L2</text>
    <line x1="380" y1="116" x2="262" y2="116" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="382" y="102" width="60" height="26" rx="6" fill="url(#grad-blue)" filter="url(#glow-blue)"/>
    <text x="412" y="119" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">L3</text>
    <line x1="380" y1="59" x2="380" y2="128" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- OUT left -->
    <line x1="78" y1="88" x2="0" y2="88" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="-110" y="74" width="108" height="28" rx="7" fill="url(#grad-orange)"/>
    <text x="-56" y="92" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">OUT</text>
  </g>
</svg>
