<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1a1926; }
      .box-text { font-family: 'Arial', sans-serif; font-size: 32px; fill: #ffffff; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .btn-text { font-family: 'Arial', sans-serif; font-weight: bold; font-size: 20px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .line-arrow { stroke: #a3a8b4; stroke-width: 2.5; fill: none; }
      .arrow-head { fill: #a3a8b4; }
    </style>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3545" />
      <stop offset="100%" stop-color="#1b1f2b" />
    </linearGradient>

    <linearGradient id="orange-btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9530f" />
      <stop offset="100%" stop-color="#a63b05" />
    </linearGradient>

    <linearGradient id="blue-btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1963c9" />
      <stop offset="100%" stop-color="#0b3c8a" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head" />
    </marker>
  </defs>

  <rect width="850" height="400" class="bg" />

  <rect x="50" y="175" width="160" height="50" rx="15" fill="url(#orange-btn)" />
  <text x="130" y="202" class="btn-text">OUT</text>
  
  <line x1="310" y1="200" x2="225" y2="200" class="line-arrow" marker-end="url(#arrow)" />


  <rect x="320" y="70" width="220" height="260" rx="18" fill="url(#body-grad)" stroke="#3f4b61" stroke-width="2" />
  <text x="430" y="203" class="box-text">Line</text>


  <line x1="610" y1="80" x2="610" y2="320" stroke="#4d5666" stroke-width="2" stroke-dasharray="5,5" />


  <g transform="translate(680, 0)">
    
    <line x1="-30" y1="105" x2="-130" y2="105" class="line-arrow" marker-end="url(#arrow)" />
    <rect x="0" y="83" width="120" height="44" rx="10" fill="url(#blue-btn)" filter="url(#glow-blue)" />
    <text x="60" y="107" class="btn-text">L1</text>

    <line x1="-30" y1="168" x2="-130" y2="168" class="line-arrow" marker-end="url(#arrow)" />
    <rect x="0" y="146" width="120" height="44" rx="10" fill="url(#blue-btn)" filter="url(#glow-blue)" />
    <text x="60" y="170" class="btn-text">L2</text>

    <line x1="-30" y1="232" x2="-130" y2="232" class="line-arrow" marker-end="url(#arrow)" />
    <rect x="0" y="210" width="120" height="44" rx="10" fill="url(#blue-btn)" filter="url(#glow-blue)" />
    <text x="60" y="234" class="btn-text">L3</text>

    <line x1="-30" y1="295" x2="-130" y2="295" class="line-arrow" marker-end="url(#arrow)" />
    <rect x="0" y="273" width="120" height="44" rx="10" fill="url(#blue-btn)" filter="url(#glow-blue)" />
    <text x="60" y="297" class="btn-text">L4</text>

  </g>
</svg>
