<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 240" width="530" height="240" style="background:#1a1a2e">
  <defs>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.7)"/></marker>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#6b21a8"/></linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0ea5e9"/><stop offset="100%" style="stop-color:#0369a1"/></linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#374151;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111827;stop-opacity:0.9"/></linearGradient>
    <radialGradient id="knob-grad" cx="35%" cy="35%"><stop offset="0%" style="stop-color:#9ca3af"/><stop offset="100%" style="stop-color:#374151"/></radialGradient>
  </defs>
  <g transform="translate(30,20)">
    <text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">BUSKIT-mini Mixer</text>
    <rect x="80" y="38" width="180" height="160" rx="10" fill="url(#grad-dark)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="165" y="62" text-anchor="middle" font-family="Arial" font-size="15" fill="rgba(255,255,255,0.7)" font-weight="bold">5 band EQ</text>
    <g opacity="0.7">
 
    </g>
    <circle cx="165" cy="90" r="14" fill="url(#knob-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="165" y1="78" x2="165" y2="84" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="165" y="118" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.6)">drive</text>
    <circle cx="165" cy="155" r="18" fill="url(#knob-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="165" y1="139" x2="165" y2="146" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="165" y="183" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.6)">gain</text>
    <line x1="15" y1="62" x2="78" y2="62" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-5" y="66" font-family="Arial" font-size="13" font-weight="bold" fill="white">IN</text>
    <line x1="15" y1="90" x2="78" y2="90" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-5" y="94" font-family="Arial" font-size="13" font-weight="bold" fill="white">Ai</text>
    <line x1="15" y1="118" x2="78" y2="118" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="122" font-family="Arial" font-size="13" font-weight="bold" fill="white">L</text>
    <line x1="15" y1="150" x2="78" y2="150" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-5" y="154" font-family="Arial" font-size="13" font-weight="bold" fill="white">EXP</text>
    <line x1="260" y1="90" x2="330" y2="90" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="332" y="76" width="100" height="26" rx="6" fill="url(#grad-purple)" filter="url(#glow-purple)"/>
    <text x="382" y="93" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Amp</text>
    <line x1="260" y1="130" x2="330" y2="130" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="332" y="116" width="100" height="26" rx="6" fill="url(#grad-cyan)"/>
    <text x="382" y="133" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Ao</text>
