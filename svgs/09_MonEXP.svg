<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" style="background:#1a1a2e">
  <defs>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.7)"/></marker>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#22c55e"/><stop offset="100%" style="stop-color:#15803d"/></linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#374151;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111827;stop-opacity:0.9"/></linearGradient>
  </defs>
  <g transform="translate(30,20)">
    <text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">MonEXP</text>
    <rect x="80" y="38" width="130" height="160" rx="10" fill="url(#grad-dark)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <line x1="20" y1="118" x2="78" y2="118" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="122" font-family="Arial" font-size="13" font-weight="bold" fill="white">IN</text>
    <line x1="210" y1="68" x2="300" y2="68" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="302" y="54" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="352" y="71" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 1</text>
    <line x1="210" y1="98" x2="300" y2="98" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="302" y="84" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="352" y="101" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 2</text>
    <line x1="210" y1="128" x2="300" y2="128" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="302" y="114" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="352" y="131" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 3</text>
    <line x1="210" y1="158" x2="300" y2="158" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="302" y="144" width="100" height="26" rx="6" fill="url(#grad-green)" filter="url(#glow-green)"/>
    <text x="352" y="161" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MON 4</text>
    <line x1="255" y1="67" x2="255" y2="158" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
</svg>
