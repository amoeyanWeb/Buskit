<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="440" height="180" style="background:#1a1a2e">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.7)"/></marker>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f97316"/><stop offset="100%" style="stop-color:#c2410c"/></linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#22c55e"/><stop offset="100%" style="stop-color:#15803d"/></linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#374151;stop-opacity:0.9"/><stop offset="100%" style="stop-color:#111827;stop-opacity:0.9"/></linearGradient>
  </defs>
  <g transform="translate(30,20)">
    <text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">BUSKIT-BAT</text>
    <rect x="60" y="38" width="120" height="90" rx="10" fill="url(#grad-dark)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="90" y="60" width="60" height="30" rx="4" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <rect x="150" y="68" width="8" height="14" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="93" y="63" width="38" height="24" rx="2" fill="url(#grad-green)" opacity="0.85"/>
    <text x="120" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.6)">Power</text>
    <line x1="0" y1="83" x2="58" y2="83" stroke="rgba(255,255,255,0.7)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-22" y="87" font-family="Arial" font-size="13" font-weight="bold" fill="white">IN</text>
    <line x1="180" y1="60" x2="270" y2="60" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="272" y="46" width="80" height="26" rx="6" fill="url(#grad-orange)"/>
    <text x="312" y="63" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">± 9V</text>

    <line x1="180" y1="86" x2="270" y2="86" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="272" y="75" width="80" height="26" rx="6" fill="url(#grad-orange)"/>
    <text x="312" y="90" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">± 12V</text>

    <line x1="180" y1="116" x2="270" y2="116" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="272" y="103" width="80" height="26" rx="6" fill="url(#grad-orange)"/>
    <text x="312" y="120" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">+ 5V</text>
    <line x1="225" y1="60" x2="225" y2="116" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
</svg>
